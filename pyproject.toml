[project]
name = "deep-agents-platform"
version = "0.1.0"
description = "Self-hosted Claude Managed Agents platform"
requires-python = ">=3.12"
dependencies = [
    "aegra-cli==0.9.7",
    "aegra-api==0.9.7",
    "deepagents==0.5.6",
    "langchain-fireworks==1.3.0",
    "langchain-nvidia-ai-endpoints>=1.2.0",
    "langchain-mcp-adapters==0.2.2",
    "langgraph-sdk>=0.1.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "cryptography>=44.0.0",
    "fastapi>=0.136.0",
    "uvicorn>=0.46.0",
    "python-ulid==3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "testcontainers==4.14.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: end-to-end tests against live server and Docker (deselect with '-m not integration')",
]
