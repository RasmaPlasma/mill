# Alembic configuration for platform tables.
# Uses a separate version_table ("platform_alembic_version") to avoid
# collision with Aegra's own Alembic migrations.

[alembic]
script_location = src/db/alembic
# URL is set programmatically in env.py from DATABASE_URL env var.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
